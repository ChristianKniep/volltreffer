{{- if not .Values.secrets.existingSecret -}}
{{- $secretName := include "wc2026.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{/*
APP_SECRET_KEY must stay stable across upgrades (changing it makes stored
betting credentials unreadable). If the user did not supply one, generate it
once and then preserve the value already stored in the cluster on every upgrade.
"dig" safely returns "" when the secret or key does not exist yet.
*/}}
{{- $appKey := .Values.secrets.appSecretKey -}}
{{- if not $appKey -}}
  {{- $prev := "" -}}
  {{- if $existing -}}
    {{- $prev = dig "data" "APP_SECRET_KEY" "" $existing -}}
  {{- end -}}
  {{- if $prev -}}
    {{- $appKey = $prev | b64dec -}}
  {{- else -}}
    {{- $appKey = randAlphaNum 48 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "wc2026.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ $appKey | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  {{- with .Values.secrets.automationToken }}
  AUTOMATION_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.footballDataToken }}
  FOOTBALL_DATA_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.teamtipToken }}
  TEAMTIP_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
