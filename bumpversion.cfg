# Semantic versioning for the wc2026 app, managed by bump2version.
#
#   pip install bump2version        # or: brew install bump2version
#   bumpversion --config-file bumpversion.cfg patch   # 1.0.1 -> 1.0.2
#   bumpversion --config-file bumpversion.cfg minor   # 1.0.1 -> 1.1.0
#   bumpversion --config-file bumpversion.cfg major   # 1.0.1 -> 2.0.0
#
# Each run rewrites the files listed below, makes a commit, and creates an
# annotated git tag matching the new version (e.g. 1.0.2). Build and push the
# container image under that same tag:
#
#   docker buildx build -t zot.lab.hvk/christiankniep/wc2026:$(cat VERSION) --push .
#
# NOTE: the UI cache-bust counter (APP_VERSION / ?v= in app.js & index.html) is
# intentionally a separate, non-semver build number and is NOT managed here.
# Likewise the Helm *chart* version (Chart.yaml `version:`) is versioned
# independently of the app per Helm convention; only `appVersion` tracks releases.

[bumpversion]
current_version = 1.0.1
commit = True
tag = True
tag_name = {new_version}
message = chore(release): bump version {current_version} -> {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}

[bumpversion:file:VERSION]

[bumpversion:file:helm/wc2026/Chart.yaml]
search = appVersion: "{current_version}"
replace = appVersion: "{new_version}"
